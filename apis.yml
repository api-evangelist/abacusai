aid: abacusai
name: Abacus.ai
description: 'Abacus.AI is a San Francisco-based artificial intelligence platform that
  positions itself as an end-to-end AI system for professionals and enterprises. Its
  ChatLLM product gives individuals and small teams a single interface to more than
  100 AI models (GPT, Claude, Gemini and others) plus AI agents and app building,
  while the Abacus.AI Enterprise platform delivers enterprise generative AI, structured
  machine learning (predictive modeling, forecasting, personalization) and optimization.
  Developers integrate the platform through a documented REST API and a first-party
  Python client library (the abacusai PyPI package), authenticating with an API key.
  This profile is maintained by the API Evangelist network and enriched from Abacus.AI''s
  public developer surface.'
